@if (mentor(); as currentMentor){
<div class="container">
    <div class="profile-avatar">
        <div class="avatar-wrapper">
            <svg lucideSquareUserRound [size]="200" [strokeWidth]=".8"></svg>
        </div>
    </div>
    <section class="profile-info">
        <div class="fullname">
            <h2>{{ currentMentor.fullName }}</h2>
        </div>
        <div class="availability-status">
            <button class="status-current" [class.available]="mentor().availability === 'Available'"
                [class.unavailable]="mentor().availability === 'Unavailable'">
                {{ currentMentor.availability === 'Available' ? 'Disponível' : 'Indisponível' }}
            </button>

            <button class="status-option" (click)="changeAvailability()">
                {{ currentMentor.availability === 'Available' ? 'Indisponível' : 'Disponível' }}
            </button>
        </div>
        <div class="education">
            <p>{{ currentMentor.courseName}} - {{ currentMentor.institution }}</p>
        </div>
        <div class="bio">
            <p>{{ currentMentor.bio }}</p>
        </div>

        <div class="stacks">
            <h2>Stacks</h2>
            <div class="stacks-tag">
                @if (currentMentor.stacks.length > 0){
                @for (stack of currentMentor.stacks; track stack.id){
                <app-stack-chip [stack]="stack"></app-stack-chip>
                }
                }
                @else {
                <p>Nenhuma stack cadastrada.</p>
                }

            </div>
        </div>
    </section>
</div>
}
