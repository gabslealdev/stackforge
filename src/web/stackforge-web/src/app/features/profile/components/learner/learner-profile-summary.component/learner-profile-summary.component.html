@if (learner(); as currentLearner){
    <div class="container">
    <div class="profile-avatar">
        <div class="avatar-wrapper">
            <svg lucideSquareUserRound [size]="200" [strokeWidth]=".8"></svg>
        </div>
    </div>
    <section class="profile-info">
        <div class="fullname">
            <h2>{{ currentLearner.fullName}}</h2>
        </div>
        <div class="mentorship">
            <div class="title-box">
                <h2>Mentorias</h2>
            </div>
            <div class="active-mentorship">
                <h3>Ativas:</h3>
                <div class="mentorships-container">
                    <p>Nenhuma mentoria ativa.</p>
                </div>
            </div>
            <div class="completed-mentorship">
                <h3>Finalizadas:</h3>
                <div class="mentorships-container">
                    <p>Nenhuma mentoria Finalizadas.</p>
                </div>
            </div>
        </div>
    </section>
</div>
}
